services:
  db:
    image: docker.io/library/postgres:18
    restart: unless-stopped
    env_file: [.env]
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: [pgdata18:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app} -h localhost"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    working_dir: /app
    restart: unless-stopped
    env_file: [.env]
    environment:
      PYTHONPATH: /app
      # DSN for containers (host = db)
      DATABASE_URL: postgresql+asyncpg://app:app@db:5432/app
      # SMTP inside docker-net — by service name
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_TLS: "false"
      SMTP_USER: ""
      SMTP_PASS: ""
      SMTP_FROM: "no-reply@example.local"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports: ["${API_PORT:-8000}:8000"]
    # command can be left or removed - compose will override CMD from Dockerfile:
    # command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  mailpit:
    image: docker.io/axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"     # Web UI (locally open http://localhost:8025)
      - "127.0.0.1:1025:1025"     # SMTP port for tests from host


volumes:
  pgdata18:
