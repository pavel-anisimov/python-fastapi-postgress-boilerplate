[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python-fastapi-postgres-boilerplate"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.136.3,<0.137.0",
  "uvicorn[standard]>=0.48.0,<0.49.0",
  "pydantic[email]>=2.13.4,<3.0.0",
  "SQLAlchemy>=2.0.50,<2.1.0",
  "asyncpg>=0.31.0,<0.32.0",
  "alembic>=1.18.4,<1.19.0",
  "bcrypt>=4.3.0,<6.0.0",
  "PyJWT>=2.13.0,<3.0.0",
  "python-dotenv>=1.2.2,<2.0.0",
  "psycopg[binary]>=3.3.4,<4.0.0",
  "email-validator>=2.3.0,<3.0.0",
]

[tool.setuptools]
# We say explicitly: search for packages only in app*, excluding alembic and others
packages = { find = { include = ["app*"], exclude = ["alembic*", "tests*", "scripts*"] } }